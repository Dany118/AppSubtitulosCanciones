[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricsync"
version = "0.2.0"
description = "Embeds time-synced lyrics into MP3 files for Android players"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Heavy ML stack, only needed for forced alignment / ASR (Phase 2).
# Install torch separately with the CUDA wheel that matches your driver:
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu124
align = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "demucs>=4.0",
    "faster-whisper>=1.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
lyricsync = "lyricsync.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lyricsync.gui" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
