<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lyricsync — revisor</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --border: #2b3038;
    --text: #e6e8ec; --muted: #8b93a1; --accent: #5aa9f0;
    --ok: #4ec9a0; --warn: #e0b341; --danger: #e5705f;
    --radius: 8px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --border: #dde1e7;
      --text: #1b1e24; --muted: #6b7280; --accent: #1f6fb8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header h1 span { color: var(--muted); font-weight: 400; }
  #now { flex: 1; min-width: 0; color: var(--muted); font-size: 13px;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; display: flex; min-height: 0; }

  #tracks {
    width: 280px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); overflow-y: auto;
  }
  #tracks button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; cursor: pointer; font: inherit;
  }
  #tracks button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  #tracks button[aria-current="true"] { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  .tname { display: block; font-size: 13px; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  .tmeta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }

  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #lyrics { flex: 1; overflow-y: auto; padding: 40vh 24px; }
  .line {
    padding: 7px 14px; border-radius: var(--radius); cursor: pointer;
    color: var(--muted); transition: color .12s, background .12s;
    display: flex; gap: 12px; align-items: baseline;
  }
  .line:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .line.active { color: var(--text); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .line.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .line.edited .stamp { color: var(--warn); }
  .stamp {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    color: var(--muted); flex-shrink: 0; width: 66px; font-variant-numeric: tabular-nums;
  }
  .ltext { flex: 1; }
  #empty { color: var(--muted); text-align: center; padding: 40px; }

  footer {
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 10px 16px; flex-shrink: 0;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  audio { height: 34px; flex: 1; min-width: 240px; }
  button.act {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button.act:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.act:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.1); }
  #offset {
    font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    min-width: 92px; text-align: center; font-variant-numeric: tabular-nums;
  }
  #offset.changed { color: var(--warn); }
  #status { font-size: 12px; color: var(--muted); flex-basis: 100%; }
  #status.ok { color: var(--ok); } #status.err { color: var(--danger); }
  kbd {
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-size: 11px; font-family: inherit;
  }
</style>
</head>
<body>
<header>
  <h1>lyricsync <span>revisor</span></h1>
  <div id="now">Elige una pista</div>
</header>

<main>
  <nav id="tracks" aria-label="Pistas"></nav>
  <section id="pane">
    <div id="lyrics"><p id="empty">Elige una pista de la lista.</p></div>
    <footer>
      <audio id="player" controls preload="metadata"></audio>
      <button class="act" id="back" title="Atrasar 100 ms (Shift: 10 ms)">◀ −100ms</button>
      <span id="offset">0 ms</span>
      <button class="act" id="fwd" title="Adelantar 100 ms (Shift: 10 ms)">+100ms ▶</button>
      <button class="act" id="tap" disabled title="Fijar el inicio de la línea seleccionada al momento actual">Marcar línea (T)</button>
      <button class="act" id="reset" disabled>Descartar</button>
      <button class="act primary" id="save" disabled>Guardar</button>
      <div id="status">
        <kbd>espacio</kbd> reproducir · <kbd>←</kbd><kbd>→</kbd> ajustar offset ·
        <kbd>↑</kbd><kbd>↓</kbd> seleccionar línea · <kbd>T</kbd> marcar · <kbd>Ctrl+S</kbd> guardar
      </div>
    </footer>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const player = $("player");

let tracks = [];
let current = null;      // index of the loaded track
let lines = [];          // [{text, start, end}] as loaded
let starts = [];         // edited start times, the source of truth for saving
let original = [];       // starts as loaded, for Descartar
let offsetMs = 0;        // accumulated global nudge, for display only
let selected = -1;
let activeLine = -1;

const fmt = (s) => {
  if (s === null || s === undefined) return "--:--";
  const m = Math.floor(s / 60), r = s - m * 60;
  return `${String(m).padStart(2, "0")}:${r.toFixed(2).padStart(5, "0")}`;
};
const dirty = () => starts.some((s, i) => s !== original[i]);

function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text;
  el.className = kind || "";
}

function refreshControls() {
  const changed = dirty();
  $("save").disabled = !changed;
  $("reset").disabled = !changed;
  $("tap").disabled = selected < 0;
  $("offset").textContent = `${offsetMs > 0 ? "+" : ""}${offsetMs} ms`;
  $("offset").className = offsetMs !== 0 ? "changed" : "";
}

async function loadTracks() {
  const res = await fetch("/api/tracks");
  tracks = (await res.json()).tracks;
  const nav = $("tracks");
  nav.innerHTML = "";
  tracks.forEach((t) => {
    const btn = document.createElement("button");
    btn.dataset.index = t.index;
    const name = document.createElement("span");
    name.className = "tname";
    name.textContent = t.name;
    const meta = document.createElement("span");
    meta.className = "tmeta";
    meta.textContent = t.hasLyrics
      ? `${t.lines} líneas${t.wordLevel ? " · por palabra" : ""}`
      : "sin letra";
    btn.append(name, meta);
    btn.onclick = () => selectTrack(t.index);
    nav.append(btn);
  });
  if (tracks.length) selectTrack(tracks[0].index);
}

async function selectTrack(index) {
  if (dirty() && !confirm("Hay cambios sin guardar. ¿Descartarlos?")) return;

  const res = await fetch(`/api/track/${index}`);
  if (!res.ok) { setStatus("No se pudo cargar la pista", "err"); return; }
  const data = await res.json();

  current = index;
  lines = data.lines;
  starts = lines.map((l) => l.start);
  original = starts.slice();
  offsetMs = 0;
  selected = -1;
  activeLine = -1;

  document.querySelectorAll("#tracks button").forEach((b) =>
    b.setAttribute("aria-current", String(Number(b.dataset.index) === index)));

  $("now").textContent = [data.artist, data.title].filter(Boolean).join(" — ") || data.name;
  player.src = `/api/audio/${index}`;
  renderLines();
  refreshControls();
  setStatus(data.lines.length ? `${data.lines.length} líneas · origen: ${data.source}` : "Esta pista no tiene letra sincronizada.");
}

function renderLines() {
  const box = $("lyrics");
  box.innerHTML = "";
  if (!lines.length) {
    const p = document.createElement("p");
    p.id = "empty";
    p.textContent = "Esta pista no tiene letra sincronizada todavía.";
    box.append(p);
    return;
  }
  lines.forEach((line, i) => {
    const row = document.createElement("div");
    row.className = "line";
    row.dataset.index = i;

    const stamp = document.createElement("span");
    stamp.className = "stamp";
    stamp.textContent = fmt(starts[i]);

    const text = document.createElement("span");
    text.className = "ltext";
    text.textContent = line.text;

    row.append(stamp, text);
    row.onclick = () => {
      selected = i;
      if (starts[i] !== null) player.currentTime = Math.max(0, starts[i]);
      paint();
      refreshControls();
    };
    box.append(row);
  });
  paint();
}

/** Repaint stamps and the active/selected classes without rebuilding the DOM. */
function paint() {
  const rows = document.querySelectorAll("#lyrics .line");
  rows.forEach((row, i) => {
    row.querySelector(".stamp").textContent = fmt(starts[i]);
    row.classList.toggle("active", i === activeLine);
    row.classList.toggle("selected", i === selected);
    row.classList.toggle("edited", starts[i] !== original[i]);
  });
}

function currentLineAt(time) {
  let found = -1;
  for (let i = 0; i < starts.length; i++) {
    if (starts[i] !== null && starts[i] <= time) found = i; else break;
  }
  return found;
}

player.addEventListener("timeupdate", () => {
  const next = currentLineAt(player.currentTime);
  if (next === activeLine) return;
  activeLine = next;
  paint();
  const row = document.querySelector(`#lyrics .line[data-index="${next}"]`);
  if (row) row.scrollIntoView({ block: "center", behavior: "smooth" });
});

function nudge(ms) {
  if (!lines.length) return;
  const delta = ms / 1000;
  starts = starts.map((s) => (s === null ? null : Math.max(0, s + delta)));
  offsetMs += ms;
  paint();
  refreshControls();
}

function tap() {
  if (selected < 0) return;
  starts[selected] = Math.max(0, player.currentTime);
  paint();
  refreshControls();
  setStatus(`Línea ${selected + 1} marcada en ${fmt(starts[selected])}`);
}

function moveSelection(step) {
  if (!lines.length) return;
  selected = selected < 0 ? 0 : Math.min(lines.length - 1, Math.max(0, selected + step));
  paint();
  refreshControls();
  const row = document.querySelector(`#lyrics .line[data-index="${selected}"]`);
  if (row) row.scrollIntoView({ block: "center", behavior: "smooth" });
}

async function save() {
  if (current === null || !dirty()) return;
  $("save").disabled = true;
  setStatus("Guardando...");
  try {
    const res = await fetch(`/api/track/${current}/save`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ starts }),
    });
    const data = await res.json();
    if (!res.ok) { setStatus(data.error || "No se pudo guardar", "err"); refreshControls(); return; }

    original = starts.slice();
    offsetMs = 0;
    paint();
    refreshControls();
    const warn = (data.warnings || []).concat(data.errors || []);
    setStatus(warn.length ? `Guardado, con avisos: ${warn.join("; ")}` : "Guardado en el MP3 y en el .lrc", warn.length ? "" : "ok");
  } catch (err) {
    setStatus(`No se pudo guardar: ${err}`, "err");
    refreshControls();
  }
}

function discard() {
  starts = original.slice();
  offsetMs = 0;
  paint();
  refreshControls();
  setStatus("Cambios descartados");
}

$("back").onclick = (e) => nudge(e.shiftKey ? -10 : -100);
$("fwd").onclick = (e) => nudge(e.shiftKey ? 10 : 100);
$("tap").onclick = tap;
$("save").onclick = save;
$("reset").onclick = discard;

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  switch (e.key) {
    case " ": e.preventDefault(); player.paused ? player.play() : player.pause(); break;
    case "ArrowLeft": e.preventDefault(); nudge(e.shiftKey ? -10 : -100); break;
    case "ArrowRight": e.preventDefault(); nudge(e.shiftKey ? 10 : 100); break;
    case "ArrowUp": e.preventDefault(); moveSelection(-1); break;
    case "ArrowDown": e.preventDefault(); moveSelection(1); break;
    case "t": case "T": e.preventDefault(); tap(); break;
  }
});

window.addEventListener("beforeunload", (e) => {
  if (dirty()) { e.preventDefault(); e.returnValue = ""; }
});

loadTracks().catch((err) => setStatus(`No se pudieron cargar las pistas: ${err}`, "err"));
</script>
</body>
</html>
